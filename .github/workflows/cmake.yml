name: LLM-Connector

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v3
      - name: Check OCI source labels
        shell: bash
        run: |
          # GHCR links a package to its repo via org.opencontainers.image.source;
          # every Containerfile/Dockerfile (incl. templates) must carry it.
          want="org.opencontainers.image.source=\"https://github.com/${GITHUB_REPOSITORY}\""
          status=0
          while IFS= read -r f; do
            grep -qF "$want" "$f" || { echo "::error file=$f::missing $want"; status=1; }
          done < <(git ls-files | grep -iE '(^|/)(containerfile|dockerfile)[^/]*$|\.(containerfile|dockerfile)(\.j2)?$' | grep -viE '\.(md|py|sh|txt|ya?ml|json)$')
          exit "$status"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libboost-all-dev libssl-dev podman buildah

      - name: Configure CMake
        run: cmake -B ${{runner.temp}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{runner.temp}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{runner.temp}}/build
        run: ctest -C ${{env.BUILD_TYPE}}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Container image
        run: buildah build -t ghcr.io/neuralmimicry/llm_connector:latest .

      - name: Push Container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: buildah push ghcr.io/neuralmimicry/llm_connector:latest
